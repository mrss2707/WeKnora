name: Memory V2 PostgreSQL
on:
  pull_request:
    paths:
      - 'internal/**/memory_v2/**'
      - 'internal/**/*memory_v2*.go'
      - 'migrations/modules/memory_v2/**'
      - '.github/workflows/memory-v2-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: paradedb/paradedb:v0.22.6-pg17
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: memory_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d memory_v2_test"
          --health-interval 3s --health-timeout 5s --health-retries 40
    env:
      WEKNORA_TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=e2e dbname=memory_v2_test sslmode=disable
      WEKNORA_TEST_PARADEDB: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: ./scripts/migrate.sh validate postgres
      - name: Race and real ParadeDB regressions
        run: >-
          go test -race -count=1
          ./internal/application/repository/memory_v2
          ./internal/application/service/memory_v2/...
          ./internal/handler ./internal/router ./internal/container
          ./internal/mcpserver ./internal/config ./internal/database
